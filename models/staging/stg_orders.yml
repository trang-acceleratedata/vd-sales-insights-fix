version: 2

models:
  - name: stg_orders
    description: >
      One row per revenue-bearing customer order. Statuses are lower-cased and
      the model admits only statuses that count toward revenue per the intent's
      acceptance rules.
    columns:
      - name: order_id
        description: Natural key from the commerce platform.
        tests:
          - not_null
          - unique
      - name: order_status
        description: Lower-cased fulfilment status.
        tests:
          - not_null
      - name: amount
        description: >
          Order value in EUR major units, cast straight from the feed with no
          rescaling — the platform's data contract is the sole authority on
          the unit `amount` is denominated in (design.md Ledger 2026-01-14).
        tests:
          - not_null
